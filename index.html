<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Darkroom — Image Search</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="masthead">
    <p class="kicker">Contact sheet no. 002</p>
    <h1>Darkroom</h1>
    <p class="lede">Type a subject. Develop the prints.</p>
  </header>

  <main>
    <form id="search-form" role="search" autocomplete="off">
      <label for="search-input" class="visually-hidden">Search images</label>
      <input id="search-input" name="q" type="search" placeholder="cats, ocean, new york…">
      <button id="search-button" type="submit">Develop</button>
    </form>

    <div class="chips" id="chips" aria-label="Quick picks">
      <button type="button" class="chip" data-query="cats">cats</button>
      <button type="button" class="chip" data-query="ocean">ocean</button>
      <button type="button" class="chip" data-query="new york">new york</button>
      <button type="button" class="chip" data-query="mountains">mountains</button>
      <button type="button" class="chip" data-query="old trains">old trains</button>
    </div>

    <p id="status" class="status" role="status" aria-live="polite"></p>
    <section id="results" class="grid" aria-label="Search results"></section>
  </main>

  <script src="app.js"></script>
</body>
</html>
